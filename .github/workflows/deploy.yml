name: Deploy staging

# Deploys the relay (Cloudflare Workers) and the controller + both apps (Cloudflare Pages)
# on every push to main. Skips cleanly until the Cloudflare secrets exist. See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet. Skipping deploy (see docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy relay (Workers, staging)
        if: steps.secrets.outputs.ready == 'true'
        id: relay
        working-directory: packages/relay
        run: |
          pnpm exec wrangler deploy --env staging | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Could not read the Worker URL"; exit 1; fi
          echo "https=$url" >> "$GITHUB_OUTPUT"
          echo "wss=${url/https:/wss:}" >> "$GITHUB_OUTPUT"

      - name: Check the deployed relay
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # A brand-new *.workers.dev address can take a minute or two to appear in DNS, so retry.
          for try in $(seq 1 24); do
            if pnpm exec tsx packages/relay/src/node/smoke.ts "${{ steps.relay.outputs.wss }}"; then exit 0; fi
            echo "not reachable yet (try $try of 24), waiting 10 s"
            sleep 10
          done
          echo "::error::The live relay never became reachable"
          exit 1

      - name: Deploy controller, Séance Party and Steady (Pages, staging branch)
        if: steps.secrets.outputs.ready == 'true'
        id: pages
        env:
          VITE_RELAY_URL: ${{ steps.relay.outputs.wss }}
        run: |
          # Stop at the first error. Without this a failed deploy still showed a green check.
          set -euo pipefail
          deploy() { # <workspace dir> <pages project>
            pnpm exec wrangler pages project create "$2" --production-branch main || echo "(project $2 already exists)"
            (cd "$1" && pnpm run build)
            pnpm exec wrangler pages deploy "$1/dist" --project-name "$2" --branch staging --commit-dirty=true 2>&1 | tee "/tmp/$2.log"
          }
          url_of() { grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' "/tmp/$1.log" | tail -1; }
          # Called directly, not inside $(...), so set -e stops the step on the first failure.
          # The controller's stable staging URL is needed by the apps for their QR codes.
          deploy packages/controller haunt-kit-play
          play=$(url_of haunt-kit-play)
          echo "play=$play" >> "$GITHUB_OUTPUT"
          export VITE_CONTROLLER_URL="https://staging.haunt-kit-play.pages.dev/"
          deploy apps/seance-party haunt-kit-seance
          seance=$(url_of haunt-kit-seance)
          deploy apps/steady haunt-kit-steady
          steady=$(url_of haunt-kit-steady)
          {
            echo "## Staging URLs"
            echo ""
            echo "| What | URL |"
            echo "|---|---|"
            echo "| Relay | ${{ steps.relay.outputs.wss }} |"
            echo "| Phone controller | https://staging.haunt-kit-play.pages.dev (this deploy: $play) |"
            echo "| Séance Party | https://staging.haunt-kit-seance.pages.dev (this deploy: $seance) |"
            echo "| Steady | https://staging.haunt-kit-steady.pages.dev (this deploy: $steady) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live pages answer
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for url in https://staging.haunt-kit-play.pages.dev https://staging.haunt-kit-seance.pages.dev https://staging.haunt-kit-steady.pages.dev; do
            ok=no
            # A brand-new *.pages.dev address can take a couple of minutes to appear in DNS.
            for try in $(seq 1 24); do
              code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && grep -q '<div id="root"\|<main' /tmp/page.html; then ok=yes; break; fi
              sleep 10
            done
            echo "$url -> $code"
            [ "$ok" = yes ] || { echo "::error::$url did not answer with a page"; exit 1; }
          done

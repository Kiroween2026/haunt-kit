name: Deploy production

# Manual only: Actions → Deploy production → Run workflow (from main).
# Publishes the relay (Workers) and the controller, Séance Party and Steady (Pages, production branch),
# then tests the live relay and checks every page. Same secrets as staging. See docs/DEPLOY.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Deploy relay (Workers, production)
        id: relay
        working-directory: packages/relay
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Could not read the Worker URL"; exit 1; }
          echo "wss=${url/https:/wss:}" >> "$GITHUB_OUTPUT"

      - name: Test the live relay
        run: |
          # A brand-new *.workers.dev address can take a minute or two to appear in DNS, so retry.
          for try in $(seq 1 24); do
            if pnpm exec tsx packages/relay/src/node/smoke.ts "${{ steps.relay.outputs.wss }}"; then exit 0; fi
            echo "not reachable yet (try $try of 24), waiting 10 s"
            sleep 10
          done
          echo "::error::The live relay never became reachable"
          exit 1

      - name: Deploy controller, Séance Party and Steady (Pages, production)
        env:
          VITE_RELAY_URL: ${{ steps.relay.outputs.wss }}
        run: |
          set -euo pipefail
          deploy() { # <workspace dir> <pages project>
            pnpm exec wrangler pages project create "$2" --production-branch main || echo "(project $2 already exists)"
            (cd "$1" && pnpm run build)
            pnpm exec wrangler pages deploy "$1/dist" --project-name "$2" --branch main --commit-dirty=true
          }
          # Called directly (not inside $(...)), so set -e stops the step on the first failure.
          deploy packages/controller haunt-kit-play
          export VITE_CONTROLLER_URL="https://haunt-kit-play.pages.dev/"
          deploy apps/seance-party haunt-kit-seance
          deploy apps/steady haunt-kit-steady
          {
            echo "## Production URLs"
            echo "| What | URL |"
            echo "|---|---|"
            echo "| Relay | ${{ steps.relay.outputs.wss }} |"
            echo "| Phone controller | https://haunt-kit-play.pages.dev |"
            echo "| Séance Party | https://haunt-kit-seance.pages.dev |"
            echo "| Steady | https://haunt-kit-steady.pages.dev |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live pages answer
        run: |
          set -euo pipefail
          for url in https://haunt-kit-play.pages.dev https://haunt-kit-seance.pages.dev https://haunt-kit-steady.pages.dev; do
            ok=no
            # A brand-new *.pages.dev address can take a couple of minutes to appear in DNS.
            for try in $(seq 1 24); do
              code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && grep -q '<div id="root"\|<main' /tmp/page.html; then ok=yes; break; fi
              sleep 10
            done
            echo "$url -> $code"
            [ "$ok" = yes ] || { echo "::error::$url did not answer with a page"; exit 1; }
          done

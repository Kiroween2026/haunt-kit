name: Deploy production

# Manual only. Run it on Tue Dec 1 (code freeze) from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Deploy relay (production)
        id: relay
        working-directory: packages/relay
        run: |
          pnpm exec wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Could not read the Worker URL"; exit 1; }
          echo "wss=${url/https:/wss:}" >> "$GITHUB_OUTPUT"

      - name: Check the deployed relay
        run: pnpm exec tsx packages/relay/src/node/smoke.ts "${{ steps.relay.outputs.wss }}"

      - name: Deploy controller and apps (Pages production branch)
        env:
          VITE_RELAY_URL: ${{ steps.relay.outputs.wss }}
          VITE_CONTROLLER_URL: https://haunt-kit-play.pages.dev/
        run: |
          for pair in "packages/controller haunt-kit-play" "apps/seance-party haunt-kit-seance" "apps/steady haunt-kit-steady"; do
            set -- $pair
            pnpm exec wrangler pages project create "$2" --production-branch main >/dev/null 2>&1 || true
            (cd "$1" && pnpm run build)
            pnpm exec wrangler pages deploy "$1/dist" --project-name "$2" --branch main --commit-dirty=true
          done
          {
            echo "## Production URLs"
            echo "| What | URL |"; echo "|---|---|"
            echo "| Relay | ${{ steps.relay.outputs.wss }} |"
            echo "| Phone controller | https://haunt-kit-play.pages.dev |"
            echo "| Séance Party | https://haunt-kit-seance.pages.dev |"
            echo "| Steady | https://haunt-kit-steady.pages.dev |"
          } >> "$GITHUB_STEP_SUMMARY"

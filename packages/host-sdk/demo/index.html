<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haunt Kit · Dot demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #0d0a14;
        color: #f4efff;
        display: grid;
        grid-template-columns: 22rem 1fr;
        height: 100vh;
      }
      aside {
        padding: 1.5rem;
        border-right: 1px solid #2a2238;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow: auto;
      }
      #qr svg {
        width: 100%;
        height: auto;
        background: #fff;
        border-radius: 0.75rem;
      }
      #code {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-align: center;
      }
      #url {
        word-break: break-all;
        color: #b9b0cc;
        font-size: 0.9rem;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      button {
        font-size: 1rem;
        padding: 0.6rem 1rem;
        border-radius: 0.6rem;
        border: 0;
        background: #bd93f9;
        color: #140f1f;
        font-weight: 700;
        cursor: pointer;
      }
      li {
        margin: 0.25rem 0;
      }
      .muted {
        color: #b9b0cc;
        font-size: 0.9rem;
      }
      .err {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1 style="margin: 0">👻 Dot demo</h1>
      <div id="qr"></div>
      <div id="code">····</div>
      <div id="url"></div>
      <button id="ghost" type="button">Add ghost player</button>
      <div>
        <strong>Players</strong> <span id="latency" class="muted"></span>
        <ul id="players"></ul>
      </div>
      <p class="muted">Tilt a phone and its dot moves. This demo shows raw tilt only.</p>
      <p id="error" class="err" role="alert"></p>
    </aside>
    <canvas id="stage" aria-label="Player dots"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

# Owner: Yadnesh. Cloudflare Worker for the Haunt Kit relay.
# Staging:    pnpm --filter @haunt-kit/relay deploy:staging
# Production: pnpm --filter @haunt-kit/relay deploy:production
name = "haunt-kit-relay"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[vars]
ENVIRONMENT = "production"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

# The Workers Free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[env.staging]
name = "haunt-kit-relay-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"
